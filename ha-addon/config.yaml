# App Home Assistant per la web app vocale locale di Vivavoce.
# (HA 2026.2 ha rinominato "Add-on" in "App" nell'interfaccia; i nomi dei file
# e le chiavi dello schema, questo incluso, non sono cambiati.)
#
# host_network: serve sia all'auto-discovery UDP di LMS sia ad avere gli IP
# LAN giusti nei SAN del certificato self-signed (il microfono del browser
# richiede HTTPS da altri dispositivi).
#
# NOTA rebrand: lo slug è cambiato da "squeezesay" a "vivavoce", quindi per
# il Supervisor questa è un'app NUOVA — chi aveva la vecchia deve
# disinstallarla e installare questa (vedi CHANGELOG.md qui accanto).
name: Vivavoce
version: "0.3.0"
slug: vivavoce
description: Controllo vocale in italiano/inglese per LMS/Squeezebox/Daphile, TIDAL e Qobuz inclusi
url: https://github.com/LucaBon/vivavoce
arch:
  - amd64
  - aarch64
  - armv7
init: false
host_network: true
options:
  https: true
  port: 8730
schema:
  https: bool
  port: port
  lms_url: str?
  player: str?
  cert_hosts: str?
  material_url: str?
