# App Home Assistant per la web app vocale locale di Vivavoce.
# (HA 2026.2 ha rinominato "Add-on" in "App" nell'interfaccia; i nomi dei file
# e le chiavi dello schema, questo incluso, non sono cambiati.)
#
# host_network: serve sia all'auto-discovery UDP di LMS sia ad avere gli IP
# LAN giusti nei SAN del certificato self-signed (il microfono del browser
# richiede HTTPS da altri dispositivi).
#
# NOTA rebrand: lo slug è cambiato da "squeezesay" a "vivavoce", quindi per
# il Supervisor questa è un'app NUOVA — chi aveva la vecchia deve
# disinstallarla e installare questa (vedi CHANGELOG.md qui accanto).
name: Vivavoce
version: "0.7.0"
slug: vivavoce
description: Controllo vocale in italiano/inglese/francese/tedesco per LMS/Squeezebox/Daphile, TIDAL e Qobuz inclusi
url: https://github.com/LucaBon/vivavoce
# Solo 64 bit. Home Assistant ha tolto le architetture a 32 bit con la
# 2025.12: da allora la base armv7 non viene più ricostruita — è ferma al
# 2025-11-21 su ogni tag Alpine, e dalla 3.23 non esiste affatto. Dichiararla
# significava offrirla a macchine il cui Supervisor, da quella versione, non
# aggiorna più le proprie informazioni sugli aggiornamenti: lì non arriva né
# un'app nuova né una versione nuova di una già installata.
# Il Pi a 32 bit resta servito dalle altre strade — sorgente e immagine
# Docker costruita in casa, parola chiave vosk compresa — che non passano di
# qui: vedi DEPLOY.md.
arch:
  - amd64
  - aarch64
init: false
host_network: true
options:
  https: true
  port: 8730
schema:
  https: bool
  port: port
  lms_url: str?
  player: str?
  cert_hosts: str?
  material_url: str?
  # Quale sistema musicale pilotare: lms (default) o musicassistant.
  backend: str?
  # Dove trovarlo, quando non e' un LMS: Music Assistant non si annuncia su
  # UDP 3483, quindi va indicato. Es. http://192.168.1.50:8095
  backend_url: str?
  # "password" e non "str": il token non va mostrato in chiaro nel pannello
  # delle opzioni ne' finire nei log del Supervisor.
  backend_token: password?
  # Un catalogo di audiolibri da ascoltare sull'impianto qui sopra:
  # audiobookshelf. Vuoto: nessun audiolibro, e non cambia niente.
  library: str?
  # Dove trovarlo. Lo deve raggiungere l'impianto, che scarica i file:
  # l'IP di rete, non localhost. Es. http://192.168.1.50:13378
  library_url: str?
  # La chiave API (Audiobookshelf: Impostazioni -> API Keys). Finisce negli
  # indirizzi in coda sull'impianto: meglio una chiave di un utente che puo'
  # solo ascoltare.
  library_token: password?
