# Vivavoce — web app vocale locale. Avvio in un comando:
#
#   docker compose up -d
#
# Poi apri https://<ip-di-questo-host>:8730 dal telefono (stessa rete) e
# accetta una volta l'avviso del certificato self-signed.
#
# Con `network_mode: host` (Linux/NAS/Raspberry Pi) funzionano sia
# l'auto-discovery UDP di LMS sia il certificato con gli IP giusti nei SAN,
# quindi di norma NON serve configurare nulla.
services:
  vivavoce:
    # Da sorgente, che è ciò che serve quando si ha il repo sotto mano.
    # Per usare invece l'immagine pubblicata a ogni release (amd64 + arm64,
    # nessun build): commenta la riga qui sotto e decommenta `image:`.
    # Producono lo stesso container.
    build: .
    # image: ghcr.io/lucabon/vivavoce:latest
    container_name: vivavoce
    network_mode: host
    restart: unless-stopped
    volumes:
      # Certificato TLS, licenza Pro e kid-safe persistenti. UN SOLO nome, lo
      # stesso di DEPLOY.md: finché erano due (qui quello storico
      # «squeezesay-data», nei documenti «vivavoce-data»), passare dai
      # documenti a questo file creava un volume vuoto — tutti i telefoni da
      # rifidare, una delle 5 attivazioni bruciata, kid-safe spento in
      # silenzio. Chi arriva dal nome storico lo migra una volta sola:
      #
      #   docker run --rm -v squeezesay-data:/from -v vivavoce-data:/to \
      #     alpine sh -c "cp -a /from/. /to/"
      #
      # e poi «docker volume rm squeezesay-data» quando è soddisfatto.
      - vivavoce-data:/data
    environment:
      VIVAVOCE_PORT: "8730"
      # Tutte opzionali — decommenta solo ciò che ti serve (i vecchi nomi
      # SQUEEZESAY_* funzionano ancora per un rilascio, con un avviso):
      # VIVAVOCE_LMS: "http://192.168.1.50:9000"   # se omesso: auto-discovery sulla LAN
      # VIVAVOCE_PLAYER: "aa:bb:cc:dd:ee:ff"       # se omesso: il primo player trovato
      # VIVAVOCE_MATERIAL_URL: "http://192.168.1.50:9000/material/"
      # VIVAVOCE_HTTPS: "0"                        # solo HTTP: mic solo su localhost
      # VIVAVOCE_CERT_HOSTS: "192.168.1.20"        # SAN extra nel certificato (vedi sotto)

    # --- Docker Desktop (Windows/Mac) o reti bridge ---------------------------
    # `network_mode: host` lì non espone davvero la LAN: commentalo e decommenta
    # `ports`. L'auto-discovery funziona lo stesso: al broadcast (che il bridge
    # blocca) segue uno sweep unicast della rete, e l'LMS trovato viene
    # ricordato nel volume per i riavvii. Utile solo VIVAVOCE_CERT_HOSTS con
    # l'IP LAN dell'host: il container vede il proprio IP interno, non quello
    # che userà il telefono, e senza il SAN giusto l'avviso del certificato
    # ricompare.
    # ports:
    #   - "8730:8730"

volumes:
  vivavoce-data:
