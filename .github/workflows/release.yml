# Publish the container image when a version tag is pushed.
#
# Why this exists: DEPLOY.md promised "Docker — one command", while
# docker-compose.yml said `build: .` — so the actual one command was "clone the
# repo and compile". This closes that gap, and gives the funnel a third number
# to count (image pulls), which is why it ships before the launch rather than
# after.
#
# No secrets beyond the GITHUB_TOKEN the workflow is handed automatically:
# GHCR takes that token for a push to the repository's own namespace.
#
# Note that CI (ci.yml) runs on branches, not tags — so a tag push would
# otherwise publish with nothing checked at all. The verify job below is that
# check, and it is deliberately aimed at the failure this repo actually has:
# a version bumped in one place and tagged as another.
#
# setup-uv is pinned to the full version, not `@v10`: from v8 its releases are
# immutable and the moving tags no longer exist. ci.yml explains the rest.

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Lets the workflow itself be exercised without inventing a tag; it builds
  # both architectures and pushes nothing.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # never abandon a half-published manifest

# Il minimo, per tutti i job: nessuno di questi ha bisogno di scrivere
# niente nel repo. Chi serve di piu' lo dice da se' (il job dell'immagine
# in release.yml chiede packages: write per la ghcr).
permissions:
  contents: read

jobs:
  verify:
    name: the tag and the code agree
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      # The one failure mode RELEASING.md is mostly about. pyproject.toml and
      # ha-addon/config.yaml are hand-edited copies of one number, and the
      # add-on Dockerfile installs refs/tags/v${BUILD_VERSION}: publishing an
      # image tagged 0.3.0 from a tree that calls itself 0.2.0 would put a
      # wrong number in front of users with nothing to catch it.
      - name: The tag matches the version in the tree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match pyproject.toml version $version"
            exit 1
          fi
          echo "v$tag matches pyproject.toml"

      # Covers the other half: the two version files agreeing with each other,
      # the add-on installing a tag rather than a branch, and every Dockerfile
      # COPY source still existing.
      - name: Check the release descriptors
        run: uv run pytest tests/test_packaging.py

  image:
    name: ghcr image (amd64 + arm64)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # The image is a file copy plus one wheel install (cryptography, which
      # publishes aarch64 wheels), so emulating arm64 costs a minute and keeps
      # this to a single job with a single manifest. If that ever stops being
      # true — an optional group baked in, something compiled from source —
      # the upgrade is native ubuntu-24.04-arm runners plus a manifest merge,
      # not a longer QEMU build.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      # GHCR requires a lowercase image path; the repository name may not be.
      - name: Work out the image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :X.Y.Z, :X.Y and :latest. No :X — pre-1.0, a bare major would mean
      # "any 0.x", which is not a promise this project can keep.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # A manual run proves the build works without publishing anything.
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          # The default variant, as documented: the optional engines are an
          # opt-in ~600 MB build arg, not something to put in everyone's pull.
          build-args: |
            ASR=0
            WAKEWORD=0
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say where it landed
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  addon-matrix:
    name: add-on architectures
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Work out which architectures the add-on claims
        id: legs
        run: |
          set -euo pipefail
          legs=$(python3 tools/ci_addon_matrix.py)
          echo "legs=$legs" >> "$GITHUB_OUTPUT"
          echo "$legs"

  addon:
    name: HA add-on image (${{ matrix.arch }})
    # In parallelo a `image`, non prima: sono due artefatti indipendenti, e
    # bloccare la pubblicazione su GHCR perché non si costruisce l'app di Home
    # Assistant terrebbe fermo un artefatto sano per un guasto di un altro. Il
    # workflow rosso è il segnale; entrambi dipendono da `verify`, che è ciò
    # che davvero non ha senso saltare.
    needs: addon-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.addon-matrix.outputs.legs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      # L'unica cosa che questo job fa diversamente dal gemello in ci.yml, ed è
      # tutto il motivo per cui esiste: su un tag BUILD_VERSION è LA VERSIONE
      # CHE SI STA RILASCIANDO. Il tarball esiste perché il tag è appena stato
      # pushato, ed è la stessa URL che userà il Supervisor — se questo passo
      # prende un 404, lo avrebbe preso ogni installazione dell'app, e adesso
      # lo scopriamo noi. ci.yml costruisce dall'ultimo tag esistente, quindi
      # senza questo job il sorgente di una release non finirebbe mai dentro
      # l'immagine dell'app prima degli utenti.
      #
      # Su workflow_dispatch non c'è un tag: si ripiega sull'ultimo esistente,
      # come ci.yml, perché la nota in testa a questo file promette che una
      # corsa a mano eserciti il workflow senza inventarsi un tag.
      #
      # Che il tag e le due copie a mano della versione siano d'accordo lo ha
      # già stabilito `verify` (il confronto con pyproject.toml, più
      # test_addon_version_matches_pyproject), quindi qui non si ricontrolla.
      - name: Work out which tag to build
        id: tag
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/*)
              version="${GITHUB_REF#refs/tags/v}"
              echo "releasing v$version"
              ;;
            *)
              # --count=1 and not `| head -1`: under pipefail a reader that stops early
              # can fail the step with 141 (tests/test_packaging.py says how).
              tag=$(git for-each-ref --count=1 --sort=-v:refname \
                      --format='%(refname:short)' 'refs/tags/v[0-9]*.[0-9]*.[0-9]*')
              if [ -z "$tag" ]; then
                echo "::error::no version tag in the repository to build the add-on from"
                exit 1
              fi
              version="${tag#v}"
              echo "::notice::manual run: building the add-on from the newest tag, $tag"
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Nessun push: l'app non ha una `image:` in config.yaml, quindi il
      # Supervisor se la costruisce da sé partendo da quella cartella. Qui si
      # costruisce solo per sapere che ci riesce. La cache si rilegge da quella
      # che scrive ci.yml, e non si riscrive: una release non deve sovrascrivere
      # con i propri layer quella che serve a ogni push.
      - uses: ./.github/actions/addon-image
        with:
          arch: ${{ matrix.arch }}
          platform: ${{ matrix.platform }}
          machine: ${{ matrix.machine }}
          base: ${{ matrix.base }}
          version: ${{ steps.tag.outputs.version }}
