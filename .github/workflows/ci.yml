# CI per Vivavoce.
#
# La suite non tocca la rete (trasporto LMS simulato) e il core è solo
# stdlib, quindi ogni job è veloce e senza segreti. VIVAVOCE_NO_REVALIDATE
# spegne per sicurezza la ri-validazione della licenza: i test iniettano già
# un http_post finto, questa è la cintura oltre alle bretelle.
#
# Le action sono fissate al SHA del commit, con il tag nel commento accanto.
# Un tag come `@v7` si sposta, e chi lo sposta esegue codice in questa CI; il
# SHA no. Il commento serve a due cose: si legge quale versione è, e
# l'annotazione «Node.js 20 is deprecated» continua a nominare l'action, così
# il trucco descritto qui sotto funziona come prima. Per alzarne una:
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
#
# Le action girano su Node 24: dal 16 giugno 2026 i runner ci forzano sopra
# tutto comunque, e finché una sola pin resta indietro il job stampa
# l'annotazione «Node.js 20 is deprecated» — che elenca i colpevoli, ed è il
# modo più rapido per sapere quali alzare la prossima volta.
#
# setup-uv è pinnata alla versione PIENA, non a `@v10`: dalla v8 le release
# sono immutabili e i tag mobili (`@v10`, `@v10.0`) non esistono più, quindi
# `@v10` non risolve affatto — alzarla richiede di scrivere il numero intero.
# Leggendo le note di rilascio per il salto dalla v5: la v6 ha rimosso gli
# input `pyproject-file` e `uv-file` (qui non usati) e non attiva più il venv
# da sola, cosa che non ci tocca perché ogni step passa da `uv run`; la v9 ha
# spento `prune-cache` di default, quindi la cache cresce più di prima.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Un push che ne supera un altro sullo stesso ref annulla il precedente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Il minimo, per tutti i job: nessuno di questi ha bisogno di scrivere
# niente nel repo. Chi serve di piu' lo dice da se' (il job dell'immagine
# in release.yml chiede packages: write per la ghcr).
permissions:
  contents: read

env:
  VIVAVOCE_NO_REVALIDATE: "1"

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # appdata.data_dir() ha un ramo Windows (%APPDATA%) che su Linux
          # non viene mai eseguito: una gamba basta a coprirlo.
          - os: windows-latest
            python: "3.12"
          # aarch64 (runner ARM ospitato da GitHub, gratuito sui repo
          # pubblici): DEPLOY.md indica il Raspberry Pi in quattro punti e
          # fino a qui nessun job girava su ARM. Il core è solo stdlib e
          # dovrebbe essere indifferente all'architettura — "dovrebbe" è
          # esattamente ciò che un job rende un fatto. Due gambe, il minimo
          # supportato e una recente, non l'intera matrice: qui interessa
          # l'architettura, le versioni le copre già la matrice x86.
          - os: ubuntu-24.04-arm
            python: "3.9"
          - os: ubuntu-24.04-arm
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --python ${{ matrix.python }}

      - name: Run the test suite
        run: uv run --python ${{ matrix.python }} pytest

  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      # Nel job matrix i browser non ci sono e tests/e2e/ salta da solo:
      # questo è l'unico job che li installa e quindi li esegue davvero.
      #
      # `playwright install` ESCE 0 ANCHE QUANDO FALLISCE: stampa "Failed to
      # install browsers" e ritorna successo. Quindi questo passo non può
      # essere l'unica garanzia — senza il resto, un'installazione fallita
      # diventa un job verde con 24 test saltati, cioè una gamba che non ha
      # guidato nessun browser mentre il segno di spunta dice il contrario.
      #
      # Il fallback esiste perché è già successo in locale: da Ubuntu 26.04
      # Playwright 1.60 rifiuta di installare chromium ("does not support
      # chromium on ubuntu26.04-x64"), e la build per 24.04 gira benissimo lì.
      # `ubuntu-latest` prima o poi diventerà 26.04 e questo job smetterà di
      # provare qualcosa nello stesso identico modo.
      - name: Install the Playwright browser
        run: |
          set -euo pipefail
          if ! uv run playwright install --with-deps chromium 2>&1 | tee /tmp/pw.log \
             || grep -q "Failed to install browsers" /tmp/pw.log; then
            echo "::warning::retrying with PLAYWRIGHT_HOST_PLATFORM_OVERRIDE"
            PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-x64 \
              uv run playwright install --with-deps chromium
          fi

      # La prova che l'installazione è servita, invece del suo codice di
      # uscita: se il browser non parte, questo passo fallisce qui e ora.
      - name: The browser actually launches
        run: |
          uv run python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              b = pw.chromium.launch()
              print('chromium', b.version)
              b.close()
          "

      # VIVAVOCE_REQUIRE_BROWSER=1: qui uno skip è un errore. Vedi la
      # docstring di tests/e2e/conftest.py — un test che non gira in silenzio
      # è peggio di uno che fallisce.
      - name: Run the browser flows
        env:
          VIVAVOCE_REQUIRE_BROWSER: "1"
        run: uv run pytest tests/e2e -v

  wakeword-vosk:
    name: free-phrase wake word (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      # No Python pin, unlike the openwakeword leg this replaced: vosk ships
      # `py3-none-*` wheels, so this group has no version ceiling at all —
      # which is half the reason it exists. It also ships an armv7l wheel, so
      # unlike `asr` it installs on a 32-bit Pi.
      - name: Sync dependencies (incl. the wakeword-vosk group)
        run: uv sync --group wakeword-vosk

      # Cached, because the alternative is a 47 MB fetch per run and the
      # alternative to THAT is the model-dependent tests skipping — and a
      # skipped test here proves nothing about the one thing worth proving.
      # phrase_out_of_vocabulary() works by capturing a warning the Kaldi C++
      # layer writes to file descriptor 2; the day a vosk release stops
      # writing it, an invented wake word starts being accepted and never
      # fires, with no error anywhere. Only a real model catches that.
      - name: Cache the Vosk model
        id: vosk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: vosk-ci/vosk-models
          key: vosk-model-small-it-0.22

      # Through the app's own fetcher rather than curl, so a cache miss also
      # exercises the start-up download against the real URL — the one thing
      # tests/test_vosk_model.py deliberately cannot check.
      - name: Fetch the model
        if: steps.vosk-cache.outputs.cache-hit != 'true'
        run: |
          uv run python -c "
          import sys
          sys.path.insert(0, 'engine'); sys.path.insert(0, 'localvoice')
          from pro.vosk_model import ensure_model
          assert ensure_model('it', 'vosk-ci'), 'fetch failed'
          "

      - name: Run the free-phrase wake-word suite
        env:
          VIVAVOCE_TEST_VOSK_MODEL: vosk-ci/vosk-models/vosk-model-small-it-0.22
        run: |
          uv run pytest tests/test_vosk_wake.py tests/test_vosk_model.py \
                        tests/test_wakematch.py tests/test_wakeword_phrase.py -v

      # The lexicon check is the safety feature of the whole engine, so its
      # two answers are asserted here as well as in the suite: a skip that
      # went unnoticed would look identical to a pass.
      - name: The lexicon check still knows a real word from an invented one
        run: |
          uv run python -c "
          import sys
          sys.path.insert(0, 'engine'); sys.path.insert(0, 'localvoice')
          from pro.vosk_wake import ServerVoskWakeSessions
          s = ServerVoskWakeSessions(lang='it', data_dir='',
                                     phrase='vivavoce',
                                     explicit_model='vosk-ci/vosk-models/vosk-model-small-it-0.22')
          assert s.available(), 'engine unavailable'
          assert s.out_of_vocabulary('vivavoce') == [], 'real word rejected'
          assert s.out_of_vocabulary('zorblax') == ['zorblax'], 'invented word accepted'
          print('lexicon check alive')
          "

  wakeword-vosk-macos:
    name: free-phrase wake word (macOS)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      # The claim this leg exists to prove. DEPLOY.md tells macOS users the
      # group installs there, and that rests on a version marker: vosk 0.3.45
      # dropped the macOS wheel, so pyproject pins Darwin to 0.3.44 instead.
      # A wheel existing on PyPI is not the same as the resolver picking it —
      # `>=0.3.44` alone did NOT, because uv resolves one version across all
      # platforms and chose 0.3.45. That was caught by reading the lockfile;
      # this is what catches it next time.
      - name: Sync dependencies (incl. the wakeword-vosk group)
        run: uv sync --group wakeword-vosk

      - name: The resolver really picked the version that has a macOS wheel
        run: |
          uv run python -c "
          import importlib.metadata as md, sys
          v = md.version('vosk')
          print('vosk', v)
          assert v != '0.3.45', 'resolved the one release with no macOS wheel'
          import vosk  # the wheel's native library actually loads
          sys.path.insert(0, 'engine'); sys.path.insert(0, 'localvoice')
          from pro.vosk_wake import available
          assert available(), 'the package is installed but not importable'
          print('engine importable on macOS')
          "

      # The model IS fetched here, and the first draft of this job skipped it
      # on the grounds that the lexicon check is "covered on Linux". It isn't:
      # Linux runs 0.3.45 and this leg is the only place 0.3.44 ever runs, so
      # the one code path that differs between the two was the one not being
      # exercised. If 0.3.44's Kaldi worded its fd-2 warning differently, the
      # capture would be non-empty (so no RuntimeError), the scan would match
      # nothing, and an invented wake phrase would be accepted on macOS and
      # then detect at 0% with no error anywhere.
      - name: Cache the Vosk model
        id: vosk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: vosk-ci/vosk-models
          key: vosk-model-small-it-0.22-macos

      - name: Fetch the model
        if: steps.vosk-cache.outputs.cache-hit != 'true'
        run: |
          uv run python -c "
          import sys
          sys.path.insert(0, 'engine'); sys.path.insert(0, 'localvoice')
          from pro.vosk_model import ensure_model
          assert ensure_model('it', 'vosk-ci'), 'fetch failed'
          "

      - name: The lexicon check works on the version macOS actually gets
        run: |
          uv run python -c "
          import sys
          sys.path.insert(0, 'engine'); sys.path.insert(0, 'localvoice')
          from pro.vosk_wake import ServerVoskWakeSessions
          s = ServerVoskWakeSessions(lang='it', data_dir='',
                                     phrase='vivavoce',
                                     explicit_model='vosk-ci/vosk-models/vosk-model-small-it-0.22')
          assert s.available(), 'engine unavailable'
          assert s.out_of_vocabulary('vivavoce') == [], 'real word rejected'
          assert s.out_of_vocabulary('zorblax') == ['zorblax'], 'invented word accepted'
          print('lexicon check alive on the Darwin pin')
          "

      - name: Run the wake-word suite
        env:
          VIVAVOCE_TEST_VOSK_MODEL: vosk-ci/vosk-models/vosk-model-small-it-0.22
        run: uv run pytest tests/test_vosk_wake.py tests/test_vosk_model.py tests/test_wakematch.py -q

  asr:
    name: local speech recognition (py3.12, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      # Installazione vera, non risoluzione: faster-whisper si appoggia a
      # CTranslate2 e onnxruntime, ed è la coppia che decide se il gruppo
      # esiste su un'architettura (vedi la nota in DEPLOY.md). Su armv7 non
      # esiste affatto, e non c'è runner ARM a 32 bit per dimostrarlo qui:
      # quel lato lo coprono i test di packaging e il messaggio d'avvio.
      - name: Sync dependencies (incl. the asr group)
        run: uv sync --python 3.12 --group asr

      # Nessun modello scaricato (~500 MB e minuti, per nulla che riguardi
      # l'architettura). L'import È il controllo: `import ctranslate2` carica
      # libctranslate2, la libreria nativa compilata per questa CPU, ed è
      # esattamente lì che un'architettura sbagliata si rompe. Poi il probe
      # che il server fa davvero all'avvio.
      #
      # tests/test_transcribe.py non gira qui apposta: usa un trascrittore
      # finto da cima a fondo, quindi passerebbe identico senza il gruppo
      # installato — la matrice principale lo copre già, e ripeterlo qui
      # darebbe l'impressione di una prova che non è.
      - name: The native libraries load, and the engine reports itself installed
        run: |
          uv run --python 3.12 python -c "
          import sys, platform
          import ctranslate2, onnxruntime
          sys.path.insert(0, 'localvoice')
          from pro.asr import WhisperTranscriber
          assert WhisperTranscriber().available(), 'faster-whisper non importabile'
          print(platform.machine(),
                '- ctranslate2', ctranslate2.__version__,
                '- onnxruntime', onnxruntime.__version__,
                '- providers', onnxruntime.get_available_providers())
          "

  sanity:
    name: sanity checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      # tools/ non è importato da nessun test: senza questo, un errore di
      # sintassi lì dentro arriverebbe fino all'utente. Girato sul minimo
      # supportato, che è il controllo più severo.
      - name: Byte-compile every module
        run: uv run --python 3.9 python -m compileall -q engine localvoice tools

      - name: Check the release descriptors
        run: uv run --python 3.12 pytest tests/test_packaging.py

      # Il linter (vedi [tool.ruff] in pyproject.toml). Qui e non nella
      # matrice: è una proprietà del sorgente, non della versione di Python
      # che lo esegue, e ruff legge `requires-python` da solo.
      - name: Lint
        run: uv run ruff check .

  docker:
    name: docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Le due varianti opzionali non venivano mai costruite in CI: un pin
        # che smette di risolvere (openwakeword contro tflite-runtime è
        # esattamente questo caso) si scopriva solo a valle, da chi la
        # costruiva a mano.
        include:
          - name: base
            args: |
              ASR=0
              WAKEWORD_VOSK=0
          - name: asr
            args: |
              ASR=1
              WAKEWORD_VOSK=0
          - name: wakeword-vosk
            args: |
              ASR=0
              WAKEWORD_VOSK=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      # Nessun push, nessun segreto: serve solo a scoprire una COPY che punta
      # a un file spostato (cosa che la suite Python non può vedere) e un pin
      # opzionale che non si installa più.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          push: false
          build-args: ${{ matrix.args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  addon-matrix:
    name: add-on architectures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Il fatto vive in ha-addon/config.yaml e ha-addon/build.yaml, e questo
      # lo legge: aggiungere un'architettura all'app è una riga in ognuno di
      # quei due file, e nessuna qui. Vedi tools/ci_addon_matrix.py.
      - name: Work out which architectures the add-on claims
        id: legs
        run: |
          set -euo pipefail
          legs=$(python3 tools/ci_addon_matrix.py)
          echo "legs=$legs" >> "$GITHUB_OUTPUT"
          echo "$legs"

  addon:
    name: HA add-on image (${{ matrix.arch }})
    needs: addon-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.addon-matrix.outputs.legs) }}
    steps:
      # I tag servono: il passo qui sotto sceglie da quale costruire.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      # QEMU e non il runner ARM nativo. Misurato in locale su una build
      # senza cache: amd64 4s, aarch64 6s — perché l'immagine è `apk add` di
      # due pacchetti precompilati più un tar scompattato, senza una riga da
      # compilare. A quel prezzo l'emulazione tiene il job su un runner solo
      # e su una strada sola.
      #
      # Finché c'era armv7 un'alternativa nativa non esisteva proprio; ora
      # esiste, quindi vale la pena dirlo: se un giorno questa immagine
      # dovesse compilare qualcosa, la strada è ubuntu-24.04-arm per la gamba
      # aarch64, non una build QEMU più lunga.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      # BUILD_VERSION è l'ULTIMO TAG CHE ESISTE, non la versione dichiarata in
      # config.yaml, ed è l'unica cosa che questo job fa diversamente dal suo
      # gemello in release.yml.
      #
      # Il Dockerfile scarica refs/tags/v${BUILD_VERSION}.tar.gz e fallisce con
      # un 404 se quel tag non c'è (apposta: vedi RELEASING.md). Su `develop`
      # fra un rilascio e l'altro la versione dichiarata è quasi sempre NON
      # ancora taggata — è lo stato normale del branch, non un guasto — quindi
      # un job che costruisse la versione dichiarata sarebbe rosso quasi
      # sempre, e la prima cosa che si fa con un job rosso quasi sempre è
      # smettere di guardarlo.
      #
      # Cosa prova allora questo job: che il Dockerfile dell'app si costruisce
      # e parte su tutte le architetture che dichiara. Cioè che le basi del
      # Supervisor esistono ancora, che `apk add python3 py3-cryptography` si
      # risolve ancora su ognuna, e che
      # l'immagine poi si avvia davvero. Nessuna di queste dipende dal sorgente
      # in transito: dipendono da monte, che si muove da solo, quando gli pare
      # e senza dircelo.
      #
      # Cosa NON prova, detto qui perché il tick verde non lo dica al posto
      # nostro: che il sorgente di QUESTO commit stia dentro l'immagine. Quello
      # lo prova release.yml, sul tag, dove è la stessa cosa che scarica il
      # Supervisor.
      - name: Work out which tag to build
        id: tag
        run: |
          set -euo pipefail
          tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$tag" ]; then
            echo "::error::no version tag in the repository to build the add-on from"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "building the add-on from $tag"

      - uses: ./.github/actions/addon-image
        with:
          arch: ${{ matrix.arch }}
          platform: ${{ matrix.platform }}
          machine: ${{ matrix.machine }}
          base: ${{ matrix.base }}
          version: ${{ steps.tag.outputs.version }}
          # Solo qui si scrive la cache: release.yml la rilegge e basta.
          cache-to: type=gha,mode=max,scope=addon-${{ matrix.arch }}
