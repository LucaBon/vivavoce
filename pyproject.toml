[project]
name = "vivavoce"
version = "0.6.0"
description = "Vivavoce — hands-free voice control for a Daphile/LMS hi-fi (TIDAL and Qobuz included), in Italian, English, French and German."
readme = "README.md"
# Open-core: tutto AGPL-3.0 tranne localvoice/pro/ (vedi licenses/README.md).
license = "AGPL-3.0-only"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=7.0",
    "cryptography>=42.0",  # solo per generare il certificato TLS locale (tools/make_cert.py)
    "playwright>=1.40",  # screenshot della UI web (tools/ui_shots.py)
    "pyyaml>=6.0",  # valida i descrittori di deploy (tests/test_packaging.py)
    "ruff>=0.14",  # il linter, configurato sotto in [tool.ruff]
]
# Riconoscimento vocale locale (/transcribe, Pro): opzionale, il core resta
# stdlib-only. Installa con: uv sync --group asr
asr = [
    "faster-whisper>=1.0",
]
# Parola chiave LIBERA lato server (/wakeword, Pro): Vosk (Kaldi) a
# riconoscimento libero, l'unico dei motori misurati che sente la frase
# scelta in casa invece di una frase inglese fissa. Gruppo ancora SEPARATO,
# per la stessa ragione per cui "wakeword" e' separato da "asr": un motore
# opzionale che non si installa non deve portarsi dietro quello che gia'
# funziona. Il modello (~50 MB per lingua) NON e' un pacchetto: va messo in
# <dati>/vosk-models/ (vedi licenses/MODELS.md).
# Due righe e non una, con i marker espliciti, e la ragione e' che abbassare e
# basta il floor NON funziona: uv risolve un'unica versione per tutte le
# piattaforme, quindi con ">=0.3.44" il lock sceglierebbe comunque la 0.3.45 e
# macOS resterebbe senza wheel. Il marker e' l'unico modo di dire "qui una
# versione, li' un'altra".
#
# Perche' macOS vuole la 0.3.44: la 0.3.45 ha smesso di pubblicare la wheel
# macOS universal2 che c'era fino alla 0.3.44, ed e' una regressione upstream
# aperta (alphacep/vosk-api#1316, #2013), non una scelta. Le due versioni sono
# state misurate fianco a fianco sulle stesse registrazioni: stesso avviso di
# vocabolario su fd 2, 15/15 in stanza silenziosa, 15/17 in barge-in, 0 falsi
# trigger su 40 minuti di sala.
#
# Su Darwin e' `!=0.3.45` e non `<0.3.45`, apposta: il fatto vero e' che QUELLA
# release non ha la wheel, non che nulla oltre la 0.3.44 vada bene. Un tappo
# congelerebbe macOS sulla 0.3.44 per sempre e in silenzio anche il giorno che
# a monte riparano; con l'esclusione una 0.3.46 con wheel macOS viene presa da
# sola, e una 0.3.46 ancora rotta fa fallire rumorosamente la gamba macOS in
# CI, che esiste apposta. Il silenzio era l'unica opzione senza un segnale.
# Installa con: uv sync --group wakeword-vosk
wakeword-vosk = [
    "vosk>=0.3.45; sys_platform != 'darwin'",
    "vosk>=0.3.44,!=0.3.45; sys_platform == 'darwin'",
]

# Questo repo è una raccolta di moduli (engine/ + tests/), non un pacchetto
# installabile: diciamo a uv di non provare a "buildarlo".
[tool.uv]
package = false

# Il linter. `engine/actions.py` portava un `# ruff: noqa` da prima che ruff
# esistesse nel progetto: il riferimento c'era, lo strumento no, e
# `uv run ruff check` falliva con «comando non trovato». Ora c'è, gira in CI
# accanto a pytest, ed è verde — quindi una violazione nuova è visibile invece
# di sparire in un rumore di fondo di ottocento.
#
# La selezione è stretta apposta. `E`/`W`/`F` sono pycodestyle e pyflakes (un
# nome non definito, un import morto, una variabile mai letta: difetti, non
# gusti) e `B` è flake8-bugbear, che trova gli errori veri del linguaggio —
# un default mutabile, un `except` che perde la causa. Tutto il resto di ciò
# che ruff sa fare riscriverebbe codice che questo repo ha scritto apposta in
# un modo, con un commento accanto che dice perché.
[tool.ruff]
# Non 88: i moduli di questo repo portano commenti lunghi e tabelle di
# messaggi, e 88 segnalava 167 righe contro le 15 che questa larghezza
# lascia — un limite che nessuno rispetta non è un limite.
line-length = 100
extend-exclude = ["localvoice/static/js"]

[tool.ruff.lint]
select = ["E", "W", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# Il bootstrap di `sys.path` deve girare PRIMA degli import che ne dipendono:
# `engine/` e `localvoice/` non sono un pacchetto installabile (vedi
# `[tool.uv] package = false`), quindi l'ordine è la cosa che li fa funzionare.
"localvoice/server.py" = ["E402"]
"tests/conftest.py" = ["E402"]
# Ogni pack di lingua espone le sue tabelle ri-esportandole DOPO `PATTERNS`,
# che è l'ordine in cui si legge: prima la grammatica, poi le parole (vedi
# `localvoice/lang/base.py`).
"localvoice/lang/*.py" = ["E402"]
# `engine/messages.py` importa `contextvars` accanto alla ContextVar che ne
# fa, dove la riga che spiega il perché è leggibile.
"engine/messages.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["engine", "localvoice"]
addopts = "-q"
