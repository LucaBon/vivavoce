[project]
name = "vivavoce"
version = "0.2.0"
description = "Vivavoce — hands-free voice control for a Daphile/LMS hi-fi (TIDAL and Qobuz included), in Italian and English."
readme = "README.md"
# Open-core: tutto AGPL-3.0 tranne localvoice/pro/ (vedi licenses/README.md).
license = "AGPL-3.0-only"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=7.0",
    "cryptography>=42.0",  # solo per generare il certificato TLS locale (tools/make_cert.py)
    "playwright>=1.40",  # screenshot della UI web (tools/ui_shots.py)
    "pyyaml>=6.0",  # valida i descrittori di deploy (tests/test_packaging.py)
]
# Riconoscimento vocale locale (/transcribe, Pro): opzionale, il core resta
# stdlib-only. Installa con: uv sync --group asr
asr = [
    "faster-whisper>=1.0",
]
# Parola chiave lato server (/wakeword, Pro, niente beep Android): opzionale
# e SEPARATO da "asr" apposta — dalla 0.5.0 openwakeword dipende (in modo
# rigido, non come extra) da tflite-runtime su Linux, che non pubblica wheel
# oltre Python 3.11: nello stesso gruppo di faster-whisper, un utente Linux
# su Python 3.12+ vedrebbe rompersi anche il riconoscimento vocale locale
# già funzionante. Isolato qui, un fallimento resta confinato a questo
# gruppo. Pin ESATTO a 0.4.0 (l'ultima release senza quella dipendenza,
# verificata dal vivo — vedi pro/wakeword.py): non alzare senza rivedere.
# Installa con: uv sync --group wakeword
wakeword = [
    "openwakeword==0.4.0",
]

# Questo repo è una raccolta di moduli (engine/ + tests/), non un pacchetto
# installabile: diciamo a uv di non provare a "buildarlo".
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["engine", "localvoice"]
addopts = "-q"
